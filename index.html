<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perspective Tool v10</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Inter;background:#0b1020;color:white;}
.header{height:60px;display:flex;align-items:center;padding:0 20px;background:#111827;}
.workspace{position:relative;height:calc(100vh - 60px);}
video,canvas{position:absolute;width:100%;height:100%;object-fit:cover;}
.controls{position:absolute;bottom:20px;left:20px;z-index:10;}
button{padding:12px;margin-right:10px;border:none;border-radius:8px;background:#3b82f6;color:white;cursor:pointer;}
</style>
</head>

<body>

<div class="header">
  <h3>Perspective Tool v10</h3>
</div>

<div class="workspace">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button onclick="startCamera()">Start Camera</button>
    <button onclick="capture()">Capture</button>
    <button onclick="applyCrop()">Apply Crop</button>
    <button onclick="recenterVP()">Recenter VP</button>
  </div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let imageData;
let edges = [];
let vanishingPoint = {x:0,y:0};

let frozen=false;
let draggingVP=false;

/* ===== CROP STATE ===== */
let crop = {x:50,y:50,w:300,h:300};
let cropping = false;
let dragCorner = null;

/* ================= CAMERA ================= */
async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"}
  });
  video.srcObject = stream;
  await new Promise(r=>video.onloadedmetadata=r);

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

/* ================= CAPTURE ================= */
function capture(){
  frozen=true;
  cropping=true;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  imageData = ctx.getImageData(0,0,canvas.width,canvas.height);

  crop = {
    x:canvas.width*0.1,
    y:canvas.height*0.1,
    w:canvas.width*0.8,
    h:canvas.height*0.8
  };

  drawCrop();
}

/* ================= APPLY CROP ================= */
function applyCrop(){
  cropping=false;
  detectEdges();
  estimateVP();
  draw();
}

/* ================= EDGE DETECTION (CROPPED) ================= */
function detectEdges(){
  edges=[];

  const d = imageData.data;
  const w = canvas.width;

  for(let y=crop.y;y<crop.y+crop.h;y+=2){
    for(let x=crop.x;x<crop.x+crop.w;x+=2){

      const i = (y*w+x)*4;

      const gx =
        -d[i-4] + d[i+4]
        -2*d[i-w*4] + 2*d[i+w*4];

      const gy =
        -d[i-w*4] + d[i+w*4]
        -2*d[i-4] + 2*d[i+4];

      const mag = Math.sqrt(gx*gx+gy*gy);

      if(mag>120){
        edges.push({
          x,y,
          angle:Math.atan2(gy,gx),
          mag
        });
      }
    }
  }

  edges.sort((a,b)=>b.mag-a.mag);
  edges = edges.slice(0,2000);
}

/* ================= VANISHING POINT ================= */
function estimateVP(){
  let sx=0, sy=0;

  edges.forEach(p=>{
    sx += p.x + Math.cos(p.angle)*400;
    sy += p.y + Math.sin(p.angle)*400;
  });

  vanishingPoint = {
    x:sx/edges.length,
    y:sy/edges.length
  };
}

/* ================= DRAW ================= */
function draw(){
  ctx.putImageData(imageData,0,0);

  // crop border
  ctx.strokeStyle="cyan";
  ctx.lineWidth=2;
  ctx.strokeRect(crop.x,crop.y,crop.w,crop.h);

  edges.forEach(p=>{
    const dx = vanishingPoint.x - p.x;
    const dy = vanishingPoint.y - p.y;

    const target = Math.atan2(dy,dx);

    let diff = Math.abs(target - p.angle);
    diff = Math.min(diff,Math.PI-diff);

    let color="red";
    if(diff<0.1) color="lime";
    else if(diff<0.2) color="yellow";

    const len=2000;
    const dirX=Math.cos(target);
    const dirY=Math.sin(target);

    ctx.strokeStyle=color;
    ctx.globalAlpha=0.6;

    ctx.beginPath();
    ctx.moveTo(p.x-dirX*len,p.y-dirY*len);
    ctx.lineTo(p.x+dirX*len,p.y+dirY*len);
    ctx.stroke();
  });

  ctx.globalAlpha=1;

  ctx.fillStyle="cyan";
  ctx.beginPath();
  ctx.arc(vanishingPoint.x,vanishingPoint.y,5,0,Math.PI*2);
  ctx.fill();
}

/* ================= CROP DRAW ================= */
function drawCrop(){
  ctx.putImageData(imageData,0,0);

  ctx.strokeStyle="cyan";
  ctx.lineWidth=3;
  ctx.strokeRect(crop.x,crop.y,crop.w,crop.h);
}

/* ================= DRAG ================= */
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;

  return {
    x:(t.clientX-rect.left)*(canvas.width/rect.width),
    y:(t.clientY-rect.top)*(canvas.height/rect.height)
  };
}

canvas.addEventListener("mousedown",e=>{
  const p=getPos(e);

  // crop mode
  if(cropping){
    if(Math.abs(p.x-crop.x)<20 && Math.abs(p.y-crop.y)<20) dragCorner="tl";
    else if(Math.abs(p.x-(crop.x+crop.w))<20 && Math.abs(p.y-crop.y)<20) dragCorner="tr";
    else if(Math.abs(p.x-crop.x)<20 && Math.abs(p.y-(crop.y+crop.h))<20) dragCorner="bl";
    else if(Math.abs(p.x-(crop.x+crop.w))<20 && Math.abs(p.y-(crop.y+crop.h))<20) dragCorner="br";
  }
  else{
    if(Math.hypot(p.x-vanishingPoint.x,p.y-vanishingPoint.y)<80){
      draggingVP=true;
    }
  }
});

canvas.addEventListener("mousemove",e=>{
  const p=getPos(e);

  if(cropping && dragCorner){
    if(dragCorner==="tl"){
      crop.w += crop.x-p.x;
      crop.h += crop.y-p.y;
      crop.x=p.x; crop.y=p.y;
    }
    if(dragCorner==="tr"){
      crop.w = p.x-crop.x;
      crop.h += crop.y-p.y;
      crop.y=p.y;
    }
    if(dragCorner==="bl"){
      crop.w += crop.x-p.x;
      crop.x=p.x;
      crop.h = p.y-crop.y;
    }
    if(dragCorner==="br"){
      crop.w = p.x-crop.x;
      crop.h = p.y-crop.y;
    }

    drawCrop();
  }

  if(draggingVP){
    vanishingPoint=p;
    draw(); // 🔥 live redraw
  }
});

canvas.addEventListener("mouseup",()=>{
  dragCorner=null;
  draggingVP=false;
});

/* ================= RECENTER ================= */
function recenterVP(){
  vanishingPoint = {
    x:canvas.width/2,
    y:canvas.height/2
  };
  draw();
}
</script>

</body>
</html>
