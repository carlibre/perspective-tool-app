<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perspective Tool v9 (Smart Page Detection)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter;
  background:#0b1020;
  color:white;
}
.header{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 20px;
  background:#111827;
}
.workspace{
  position:relative;
  height:calc(100vh - 60px);
}
video, canvas{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}
.controls{
  position:absolute;
  bottom:20px;
  left:20px;
  z-index:10;
}
button{
  padding:12px;
  margin-right:10px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <h3>Perspective Tool v9</h3>
</div>

<div class="workspace">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button onclick="startCamera()">Start Camera</button>
    <button onclick="capture()">Capture</button>
    <button onclick="recenterVP()">Recenter VP</button>
  </div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let imageData;
let edges = [];
let vanishingPoint = {x:0,y:0};
let pagePolygon = [];
let frozen = false;
let dragging = false;

/* ================= CAMERA ================= */
async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"}
  });
  video.srcObject = stream;
  await new Promise(r=>video.onloadedmetadata=r);

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

/* ================= CAPTURE ================= */
function capture(){
  frozen = true;

  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  imageData = ctx.getImageData(0,0,canvas.width,canvas.height);

  detectPage();   // 🔥 NEW
  detectEdges();
  estimateVP();
  draw();
}

/* ================= PAGE DETECTION ================= */
function detectPage(){
  const d = imageData.data;
  const w = canvas.width;
  const h = canvas.height;

  let points = [];

  // find strong contrast edges (likely page border)
  for(let y=2;y<h-2;y+=4){
    for(let x=2;x<w-2;x+=4){
      const i = (y*w+x)*4;

      const gx = d[i+4] - d[i-4];
      const gy = d[i+w*4] - d[i-w*4];

      const mag = Math.sqrt(gx*gx+gy*gy);

      if(mag > 200){
        points.push({x,y});
      }
    }
  }

  // find extreme corners (simple but effective)
  let tl = {x:99999,y:99999};
  let tr = {x:0,y:99999};
  let bl = {x:99999,y:0};
  let br = {x:0,y:0};

  points.forEach(p=>{
    if(p.x+p.y < tl.x+tl.y) tl = p;
    if((w-p.x)+p.y < (w-tr.x)+tr.y) tr = p;
    if(p.x+(h-p.y) < bl.x+(h-bl.y)) bl = p;
    if((w-p.x)+(h-p.y) < (w-br.x)+(h-br.y)) br = p;
  });

  pagePolygon = [tl,tr,br,bl];
}

/* ================= POINT IN POLYGON ================= */
function insidePage(x,y){
  let inside = false;

  for(let i=0,j=pagePolygon.length-1;i<pagePolygon.length;j=i++){
    const xi = pagePolygon[i].x, yi = pagePolygon[i].y;
    const xj = pagePolygon[j].x, yj = pagePolygon[j].y;

    const intersect =
      ((yi>y)!=(yj>y)) &&
      (x < (xj-xi)*(y-yi)/(yj-yi)+xi);

    if(intersect) inside = !inside;
  }

  return inside;
}

/* ================= EDGE DETECTION ================= */
function detectEdges(){
  edges = [];

  const d = imageData.data;
  const w = canvas.width;
  const h = canvas.height;

  for(let y=2;y<h-2;y+=2){
    for(let x=2;x<w-2;x+=2){

      if(!insidePage(x,y)) continue; // 🔥 key filter

      const i = (y*w+x)*4;

      const gx =
        -d[i-4] + d[i+4]
        -2*d[i-w*4] + 2*d[i+w*4];

      const gy =
        -d[i-w*4] + d[i+w*4]
        -2*d[i-4] + 2*d[i+4];

      const mag = Math.sqrt(gx*gx+gy*gy);

      if(mag > 120){
        edges.push({
          x,y,
          angle:Math.atan2(gy,gx),
          mag
        });
      }
    }
  }

  edges.sort((a,b)=>b.mag-a.mag);
  edges = edges.slice(0,1500); // 🔥 fewer, cleaner
}

/* ================= VANISHING POINT ================= */
function estimateVP(){
  let sx=0, sy=0;

  edges.forEach(p=>{
    sx += p.x + Math.cos(p.angle)*400;
    sy += p.y + Math.sin(p.angle)*400;
  });

  vanishingPoint = {
    x:sx/edges.length,
    y:sy/edges.length
  };
}

/* ================= DRAW ================= */
function draw(){
  ctx.putImageData(imageData,0,0);

  // draw page boundary
  ctx.strokeStyle="cyan";
  ctx.lineWidth=2;
  ctx.beginPath();
  pagePolygon.forEach((p,i)=>{
    if(i===0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  });
  ctx.closePath();
  ctx.stroke();

  edges.forEach(p=>{
    const dx = vanishingPoint.x - p.x;
    const dy = vanishingPoint.y - p.y;

    const target = Math.atan2(dy,dx);

    let diff = Math.abs(target - p.angle);
    diff = Math.min(diff, Math.PI-diff);

    let color="red";
    if(diff<0.1) color="lime";
    else if(diff<0.2) color="yellow";

    const len = 2000;
    const dirX = Math.cos(target);
    const dirY = Math.sin(target);

    ctx.strokeStyle=color;
    ctx.globalAlpha=0.6;

    ctx.beginPath();
    ctx.moveTo(p.x - dirX*len, p.y - dirY*len);
    ctx.lineTo(p.x + dirX*len, p.y + dirY*len);
    ctx.stroke();
  });

  ctx.globalAlpha=1;

  ctx.fillStyle="cyan";
  ctx.beginPath();
  ctx.arc(vanishingPoint.x,vanishingPoint.y,5,0,Math.PI*2);
  ctx.fill();
}

/* ================= DRAG ================= */
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;

  return {
    x:(t.clientX-rect.left)*(canvas.width/rect.width),
    y:(t.clientY-rect.top)*(canvas.height/rect.height)
  };
}

function startDrag(e){
  if(!frozen) return;

  const p = getPos(e);

  if(Math.hypot(p.x-vanishingPoint.x,p.y-vanishingPoint.y)<80){
    dragging=true;
  }
}

function drag(e){
  if(!dragging) return;

  vanishingPoint = getPos(e);
  draw();
}

function stopDrag(){
  dragging=false;
}

canvas.addEventListener("mousedown",startDrag);
canvas.addEventListener("mousemove",drag);
canvas.addEventListener("mouseup",stopDrag);

/* ================= RECENTER ================= */
function recenterVP(){
  vanishingPoint = {
    x:canvas.width/2,
    y:canvas.height/2
  };
  draw();
}
</script>

</body>
</html>
